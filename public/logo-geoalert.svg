<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="42" stroke="#0E2A5C" stroke-width="5"/>

  <!-- Inner ring (radar/compass circle) -->
  <circle cx="50" cy="50" r="27" stroke="#0E2A5C" stroke-width="4.5"/>

  <!-- Cardinal cross lines (only between outer & inner ring) -->
  <line x1="50" y1="6"  x2="50" y2="23" stroke="#0E2A5C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="77" x2="50" y2="94" stroke="#0E2A5C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="6"  y1="50" x2="23" y2="50" stroke="#0E2A5C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="77" y1="50" x2="94" y2="50" stroke="#0E2A5C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Location pin (teardrop shape pointing down) -->
  <!-- Pin body: rounded top -->
  <path d="M50 28 C41.5 28 35 34.5 35 43 C35 54 50 68 50 68 C50 68 65 54 65 43 C65 34.5 58.5 28 50 28 Z" fill="#0E2A5C"/>
  <!-- Pin inner circle (hole) -->
  <circle cx="50" cy="43" r="6.5" fill="white"/>
</svg>
